<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nihal Pasham</title>
  <meta name="description" content="Notes on compilers, Rust, GPU architecture, and formal verification." />
  <script>
    (function () {
      var saved = localStorage.getItem('np-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg: #ffffff;
      --bg-subtle: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --fg: #0f172a;
      --fg-body: #1e293b;
      --fg-muted: #64748b;
      --blue-border: #3b82f6;
      --emerald-bg: #dcfce7;
      --emerald-border: #059669;
      --amber-bg: #fef3c7;
      --amber-border: #d97706;
      --amber-text: #92400e;
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --bg-subtle: #111827;
      --surface: #151e2e;
      --surface-alt: #1e293b;
      --border: #263348;
      --border-strong: #3b4c66;
      --fg: #f8fafc;
      --fg-body: #cbd5e1;
      --fg-muted: #94a3b8;
      --blue-border: #60a5fa;
      --emerald-bg: #064e3b;
      --emerald-border: #34d399;
      --amber-bg: #451a03;
      --amber-border: #fbbf24;
      --amber-text: #fde68a;
    }

    * { box-sizing: border-box; }

    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg-body);
      transition: background 0.2s ease, color 0.2s ease;
    }

    body {
      margin: 0;
      padding: 0;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15.5px;
      color: var(--fg);
      text-decoration: none;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--emerald-border);
      box-shadow: 0 0 0 4px var(--emerald-bg);
    }

    .topbar-links {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }

    .topbar-links a {
      color: var(--fg-muted);
      text-decoration: none;
      font-weight: 500;
    }

    .topbar-links a:hover {
      color: var(--fg);
    }

    .theme-btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
    }

    .theme-btn:hover {
      border-color: var(--blue-border);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px 96px;
    }

    .intro {
      margin-bottom: 48px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin: 0 0 10px;
    }

    .bio {
      font-size: 17px;
      color: var(--fg-muted);
      margin: 0;
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-muted);
      margin: 0 0 18px;
    }

    .post-card {
      display: block;
      text-decoration: none;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 14px;
      padding: 22px 24px;
      transition: border-color 0.16s ease, transform 0.16s ease;
    }

    .post-card:hover {
      border-color: var(--blue-border);
      transform: translateY(-1px);
    }

    .post-card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--fg-muted);
      margin-bottom: 8px;
    }

    .tag-preview {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--amber-bg);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
      font-weight: 600;
      font-size: 11px;
    }

    .post-card-title {
      font-size: 21px;
      font-weight: 750;
      color: var(--fg);
      margin: 0 0 6px;
      line-height: 1.3;
    }

    .post-card-desc {
      font-size: 15.5px;
      color: var(--fg-muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span class="brand-dot"></span>
        <span>Nihal Pasham</span>
      </a>
      <div class="topbar-links">
        <a href="https://github.com/nihalpasham" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-btn" id="themeToggle" type="button">Dark mode</button>
      </div>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1>Nihal Pasham</h1>
      <p class="bio">Notes on compilers, Rust, GPU architecture, and formal verification.</p>
    </section>

    <h2 class="section-label">Writing</h2>

    <a class="post-card" href="/posts/provably-safe-gpu-kernels/">
      <div class="post-card-meta">
        <span>2026-11-23</span>
        <span>&middot;</span>
        <span>3.5 min read</span>
        <span class="tag-preview">preview</span>
      </div>
      <div class="post-card-title">Provably Safe and Fast GPU Kernels in Rust</div>
      <p class="post-card-desc">
        Specify and verify safety properties on your Rust kernels, and emit fast PTX with zero runtime checks.
      </p>
    </a>
  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    function syncBtn() {
      const cur = document.documentElement.getAttribute('data-theme');
      themeToggle.textContent = cur === 'dark' ? 'Light mode' : 'Dark mode';
    }
    syncBtn();
    themeToggle.addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('np-theme', next);
      syncBtn();
    });
  </script>
</body>
</html>
